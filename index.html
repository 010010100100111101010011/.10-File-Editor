<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(00101110){00110001}{00110000}</title>
    <style>
        body {
            font-family: monospace, Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f4f6f8;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            word-break: break-all;
            font-size: 18px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            word-break: break-all;
        }
        textarea {
            width: 100%;
            height: 150px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        textarea[readonly] {
            background-color: #eef2f5;
            cursor: not-allowed;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        button, input[type="file"]::file-selector-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            word-break: break-all;
        }
        button:hover, input[type="file"]::file-selector-button:hover {
            background-color: #2980b9;
        }
        .file-input {
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 4px;
            background: #fff;
        }
        .status-badge {
            display: inline-block;
            font-size: 11px;
            background-color: #e8f8f5;
            color: #16a085;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1 id="mainHeader"></h1>

    <div class="container">
        <div class="section">
            <label id="fileLabel" for="fileLoader"></label>
            <input type="file" id="fileLoader" class="file-input" accept=".10,.txt">
        </div>

        <hr>

        <div class="section">
            <label for="textInput">
                <span id="textLabel"></span>
                <span id="badge1" class="status-badge"></span>
            </label>
            <textarea id="textInput" placeholder="Type plain text here..."></textarea>
        </div>

        <hr>

        <div class="section">
            <label for="binaryInput">
                <span id="binaryLabel"></span>
                <span id="badge2" class="status-badge"></span>
            </label>
            <textarea id="binaryInput" readonly></textarea>
            <div class="controls">
                <button id="downloadBtn" onclick="download10File()" style="background-color: #2ecc71;"></button>
            </div>
        </div>
    </div>

    <script>
        // Converts any standard string to .10 format code
        function stringTo10(text) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const codePoint = char.codePointAt(0);
                const isDigit = /^[0-9]$/.test(char);
                let bin = codePoint.toString(2);

                if (codePoint <= 255) {
                    bin = bin.padStart(8, '0');
                } else if (bin.length % 2 !== 0) {
                    bin = '0' + bin;
                }

                if (isDigit) {
                    result += `{${bin}}`;
                } else {
                    result += `(${bin})`;
                }
            }
            return result;
        }

        // Apply binary labels to UI on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('mainHeader').innerText = stringTo10(".10 Live File Opener & Editor");
            document.getElementById('fileLabel').innerText = stringTo10("Open a .10 File:");
            document.getElementById('textLabel').innerText = stringTo10("Plain Text Input");
            document.getElementById('binaryLabel').innerText = stringTo10(".10 Binary Output");
            document.getElementById('badge1').innerText = stringTo10("Auto Sync");
            document.getElementById('badge2').innerText = stringTo10("Read Only");
            document.getElementById('binaryInput').placeholder = stringTo10("Binary code output...");
            document.getElementById('downloadBtn').innerText = stringTo10("Download .10 File");
        });

        const textInput = document.getElementById('textInput');
        const binaryInput = document.getElementById('binaryInput');

        // Live Convert Plain Text -> .10 Format
        function convertTo10() {
            binaryInput.value = stringTo10(textInput.value);
        }

        // Live Convert .10 Format -> Plain Text
        function convertFrom10() {
            let binaryText = binaryInput.value;
            let result = '';

            const pattern = /([\(\{])([01]+)([\)\}])/g;
            let match;

            while ((match = pattern.exec(binaryText)) !== null) {
                let bits = match[2];

                if (bits.length % 2 !== 0) {
                    bits = '0' + bits;
                }

                const charCode = parseInt(bits, 2);
                result += String.fromCodePoint(charCode);
            }

            textInput.value = result;
        }

        // Real-Time Event Listener for Plain Text input
        textInput.addEventListener('input', convertTo10);

        // Load a .10 File into the application
        document.getElementById('fileLoader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                binaryInput.value = e.target.result;
                convertFrom10();
            };
            reader.readAsText(file);
        });

        // Download current .10 code as a file
        function download10File() {
            const content = binaryInput.value;
            if (!content) {
                alert(stringTo10('No content to download!'));
                return;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'file.10';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
